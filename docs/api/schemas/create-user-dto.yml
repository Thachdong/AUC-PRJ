CreateUserDto:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: User's email address (must be unique)
      example: "john.doe@example.com"
      maxLength: 255
    password:
      type: string
      format: password
      description: |
        Strong password meeting the following requirements:
        - At least 8 characters long
        - Contains at least one uppercase letter
        - Contains at least one lowercase letter
        - Contains at least one number
        - Contains at least one special character
      example: "StrongP@ssw0rd123"
      minLength: 8
    phone:
      type: string
      description: Phone number in international format (optional)
      example: "+1234567890"
      pattern: "^\\+[1-9]\\d{1,14}$"
    fullName:
      type: string
      description: User's full name (optional)
      example: "John Doe"
      maxLength: 255
    address:
      type: string
      description: User's address (optional)
      example: "123 Main St, City, State 12345"
    companyName:
      type: string
      description: Company name for business accounts (optional)
      example: "Tech Solutions Inc"
      maxLength: 255
    taxCode:
      type: string
      description: Tax identification code (optional, must be unique)
      example: "TAX123456789"
      maxLength: 50