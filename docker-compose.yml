version: '3.8'

services:
  dev_db:
    image: postgres:15-alpine
    container_name: auc_dev_db
    env_file:
      - ./.env.development
    ports:
      - "5433:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    networks:
      - auc_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auc_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: Password@123
    ports:
      - "8080:80"
    depends_on:
      - dev_db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - auc_network

volumes:
  dev_db_data:
    driver: local
  pgadmin_data:
    driver: local
networks:
  auc_network:
    driver: bridge